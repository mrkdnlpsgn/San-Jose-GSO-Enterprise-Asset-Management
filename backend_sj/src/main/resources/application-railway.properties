# Production settings on Railway (SPRING_PROFILES_ACTIVE=railway). application.properties is not
# in git, so this file carries every setting the app needs, and every secret comes from a Railway
# service variable. Nothing secret belongs in this file.
spring.application.name=inventory

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Tables are created by the SQL scripts and the services' startup checks, not by Hibernate.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL:none}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Railway sets PORT; the web service's proxy calls backend.railway.internal on this port.
server.port=${PORT:8080}
spring.mvc.async.request-timeout=-1

# Uploaded photos: a Railway volume is mounted here so they survive redeploys.
app.upload-dir=${UPLOAD_DIR:/app/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
cookie.secure=${COOKIE_SECURE:true}

notifications.enabled=${NOTIFICATIONS_ENABLED:true}
philsms.api-key=${PHILSMS_API_KEY:}
philsms.sender-id=${PHILSMS_SENDER_ID:}
philsms.url=https://dashboard.philsms.com/api/v3/sms/send

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# The health check Railway waits on should mean "the API is serving", not "Gmail answered".
management.health.mail.enabled=false
mail.from=${MAIL_FROM:}
mail.from-name=San Jose GSO Inventory Management System
# Optional Google Apps Script relay (mail-relay/Code.gs); when set, mail goes through it, not SMTP.
mail.relay.url=${MAIL_RELAY_URL:}
mail.relay.secret=${MAIL_RELAY_SECRET:}

# Never reset the seeded admin / ict_staff passwords on a live database.
app.seed-default-accounts=${SEED_DEFAULT_ACCOUNTS:false}

webhook.verification.enabled=${WEBHOOK_VERIFICATION_ENABLED:false}
webhook.secret=${WEBHOOK_SECRET:}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

ai.recommendations.enabled=${AI_RECOMMENDATIONS_ENABLED:true}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model.fast=${GEMINI_MODEL_FAST:gemini-3.5-flash-lite}
gemini.model.smart=${GEMINI_MODEL_SMART:gemini-2.5-flash}
