name: Keep backend awake

# Render's free tier puts the backend to sleep after ~15 minutes without traffic, and the
# first sign-in afterwards waits a minute or more while it starts. Pinging the health
# endpoint every 10 minutes keeps it awake. If it still isn't answering after a few
# minutes of retries the run fails, and GitHub emails the repo owner - a basic outage alert.
# GitHub may start scheduled runs a few minutes late, and turns schedules off after 60 days
# with no commits (re-enable under Actions → Keep backend awake).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping backend health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /actuator/health
        run: |
          url="https://sjgso.onrender.com/actuator/health"
          # Up to ~3 minutes: covers a cold start or a deploy switching over.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$url" || true)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::Backend did not answer with 200 at $url"
          exit 1
